server {
  listen 8080;
  root   /usr/share/nginx/html;
  index  index.html;

  gzip_types text/plain text/html text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
  gzip_min_length 1000;
  gzip_proxied no-cache no-store private expired auth;

  location / {
    add_header Cache-Control "private, no-cache, no-store, max-age=0, must-revalidate";
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri $uri/ =404;
    gzip on;
  }
}
